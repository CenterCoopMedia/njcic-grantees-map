name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check js/app.js
          node --check staging/js/app.js
          node --check scripts/sync-airtable.js
          node --check sw.js
      - name: Check PHP syntax without executing the sync
        run: php -l server/sync.php
      - name: Check synthetic transformation contracts
        run: node --test tests/*.test.js
